services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  resume-service:
    build:
      context: .
      dockerfile: docker/resume.Dockerfile
    environment:
      MONGO_URI: mongodb://mongo:27017
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:4001/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  vacancy-service:
    build:
      context: .
      dockerfile: docker/vacancy.Dockerfile
    environment:
      MONGO_URI: mongodb://mongo:27017
    depends_on:
      mongo:
        condition: service_healthy

  matching-service:
    build:
      context: .
      dockerfile: docker/matching.Dockerfile
    environment:
      MONGO_URI: mongodb://mongo:27017
      RESUME_SERVICE_URL: http://resume-service:4001
      VACANCY_SERVICE_URL: http://vacancy-service:4002
    depends_on:
      resume-service:
        condition: service_healthy
      vacancy-service:
        condition: service_started

  gateway:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    environment:
      RESUME_SERVICE_URL: http://resume-service:4001
      VACANCY_SERVICE_URL: http://vacancy-service:4002
      MATCHING_SERVICE_URL: http://matching-service:4003
    ports:
      - "4000:4000"
    depends_on:
      - resume-service
      - vacancy-service
      - matching-service

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "4321:80"
    depends_on:
      - gateway

volumes:
  mongo_data:
