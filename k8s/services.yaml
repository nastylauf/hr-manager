apiVersion: apps/v1
kind: Deployment
metadata:
  name: resume-service
spec:
  replicas: 1
  selector: { matchLabels: { app: resume-service } }
  template:
    metadata: { labels: { app: resume-service } }
    spec:
      containers:
        - name: resume-service
          image: hr-manager/resume-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 4001 }]
          envFrom:
            - configMapRef: { name: hr-manager-config }
          readinessProbe:
            httpGet: { path: /health, port: 4001 }
---
apiVersion: v1
kind: Service
metadata: { name: resume-service }
spec:
  selector: { app: resume-service }
  ports: [{ port: 4001, targetPort: 4001 }]
---
